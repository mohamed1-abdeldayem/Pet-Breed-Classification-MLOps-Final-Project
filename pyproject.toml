[project]
name = "pet-breed-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Abdeldayem", email = "mabdeldayem052@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.54.0",
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "psycopg>=3.3.6",
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "dvc-s3>=3.3.0",
]

[project.scripts]
pet-breed-mlops = "pet_breed_mlops:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_breed_mlops"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "numpy>=2.5.3",
    "ruff>=0.16.10",
    "pre-commit>=4.6.2",
    "httpx>=0.28.1",
]
