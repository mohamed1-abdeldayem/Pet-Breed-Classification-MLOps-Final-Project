[project]
name = "pet-breed-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Abdeldayem", email = "mabdeldayem052@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
pet-breed-mlops = "pet_breed_mlops:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0","hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
