services:
  api:
    build: .
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet50
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports/monitoring:/app/reports/monitoring:ro
    restart: unless-stopped

  stable:
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet18
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  canary:
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet50
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - stable
      - canary
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlflow -d mlflow" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
      build: ./docker/mlflow
      ports:
        - "5000:5000"
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - mlartifacts:/mlartifacts
      command: >
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination /mlartifacts --serve-artifacts

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  pgdata:
  mlartifacts:
  grafana-data: