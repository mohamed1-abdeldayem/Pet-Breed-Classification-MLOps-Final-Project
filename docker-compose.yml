services:
  api:
    build: .
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet50
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports/monitoring:/app/reports/monitoring:ro
    restart: unless-stopped

  stable:
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet18
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  canary:
    image: pet-breed
    environment:
      PET_MODEL_DIR: /app/models/resnet50
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - stable
      - canary
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlflow -d mlflow" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
      build: ./docker/mlflow
      ports:
        - "5000:5000"
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - mlartifacts:/mlartifacts
      command: >
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination /mlartifacts --serve-artifacts

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped


  training-runner:
    image: pet-breed-training:local
    container_name: pet-breed-training-runner
    working_dir: /workspace
    entrypoint: ["python", "-c"]
    command: ["import time; time.sleep(10**9)"]
    environment:
      PET_LABEL_MAP: /workspace/configs/label_map.json
    volumes:
      - ./:/workspace
    healthcheck:
      disable: true
    restart: unless-stopped

  airflow:
    image: pet-breed-airflow:local
    container_name: pet-breed-airflow
    user: "0:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      PROJECT_ROOT: "${PROJECT_ROOT}"
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - prometheus
      - training-runner
    healthcheck:
      test: ["CMD", "/opt/airflow-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
volumes:
  pgdata:
  mlartifacts:
  grafana-data:







